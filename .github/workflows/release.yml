name: Build signed NOVA release
on:
  push:
    branches: [main]
    paths: [NovaStudio.py, VERSION.txt, CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and release
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION.txt)
          [[ "$VERSION" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$ ]] || { echo 'Invalid VERSION.txt'; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists. Increase VERSION.txt; delete a failed draft manually before retrying.'
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install test dependencies
        if: steps.version.outputs.exists != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libgl1
          python -m pip install PyQt6 Appium-Python-Client==6.0.7 cryptography
      - name: Test embedded program
        if: steps.version.outputs.exists != 'true'
        run: |
          python -m py_compile NovaStudio.py
          python NovaStudio.py --self-test
      - name: Prepare signed release
        if: steps.version.outputs.exists != 'true'
        env:
          NOVA_SIGNING_KEY: ${{ secrets.NOVA_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOVA_SIGNING_KEY" || { echo 'Add repository secret NOVA_SIGNING_KEY first'; exit 1; }
          umask 077
          KEYFILE="$RUNNER_TEMP/nova-private.key"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$NOVA_SIGNING_KEY" > "$KEYFILE"
          python NovaStudio.py --publish NovaStudio.py --key "$KEYFILE" \
            --version "$VERSION" --github-repo "$GITHUB_REPOSITORY" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/NovaStudio.py" \
            --manifest-url "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json" \
            --output artifacts --notes "$(head -c 4000 CHANGELOG.md)"
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('artifacts/NovaStudio.zip','w',ZIP_DEFLATED) as archive:
              archive.write('artifacts/NovaStudio.py','NovaStudio.py')
          PY
      - name: Upload then publish complete release
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "NOVA Studio $TAG" --notes-file CHANGELOG.md
          gh release upload "$TAG" artifacts/NovaStudio.py artifacts/manifest.json artifacts/NovaStudio.zip --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
